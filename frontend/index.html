<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Brainstorming Canvas</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
</head>
<body>
    <div class="main-container">
        <div class="controls-container">
            <h1>AI Brainstorming</h1>
            
            <div id="selection-display" class="selection-box" style="display: none;">
                <!-- This section was removed in a previous step, keeping it clean -->
            </div>

            <div class="input-area">
                <label id="prompt-label" for="prompt-input">Enter a new idea to start a tree:</label>
                <textarea id="prompt-input" placeholder="e.g., A gallery website that specializes in digital art..."></textarea>
                <button id="submit-button">Create Idea Node</button>
            </div>

            <div class="loader" id="loader" style="display: none;"></div>
        </div>

        <div id="cy"></div>
    </div>

    <!-- === MODAL POP-UP WINDOW === -->
    <div id="idea-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="modal-title">Node Details</h2>
            <div id="modal-text-content">
                <!-- Full text will be injected here by JavaScript -->
            </div>
            <!-- === NEW STATUS CONTROLS === -->
            <div class="status-controls">
                <button class="status-btn" data-status="Idea">Idea</button>
                <button class="status-btn" data-status="InProgress">In Progress</button>
                <button class="status-btn" data-status="Completed">Completed</button>
                <button class="status-btn" data-status="Archived">Archived</button>
            </div>

            <div class="modal-actions">
                <button id="modal-delete-button" class="danger">Delete Node</button>
                <button id="modal-close-button">Close</button>
            </div>
        </div>
    </div>

    <!-- THE SCRIPT IS LOADED ONLY ONCE AT THE VERY END -->
    <script src="script.js"></script>

</body>
</html>
