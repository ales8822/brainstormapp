<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Brainstorming Pad</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI Brainstorming Pad</h1>
        <p>Enter an idea, a question, or a concept to start exploring.</p>
        <div class="input-area">
            <textarea id="prompt-input" placeholder="e.g., A gallery website that specializes in digital art..."></textarea>
            <button id="submit-button">Brainstorm</button>
        </div>
        <div class="response-area">
            <h2>AI Assistant</h2>
            <div id="response-container">
                <p>Your AI-generated ideas will appear here...</p>
            </div>
             <div class="loader" id="loader" style="display: none;"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
