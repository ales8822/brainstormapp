<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Brainstorming Canvas</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
  </head>
  <body>
    <div class="main-container">
      <div class="controls-container">
        <h1>AI Brainstorming</h1>
        <div class="input-area">
          <label id="prompt-label" for="prompt-input"
            >Enter a new idea to start a tree:</label
          >
          <textarea
            id="prompt-input"
            placeholder="e.g., A gallery website that specializes in digital art..."
          ></textarea>
          <button id="submit-button">Create Idea Node</button>
        </div>
        <div class="loader" id="loader" style="display: none"></div>

        <div id="settings-button" class="settings-icon">⚙️</div>
      </div>
      <div id="cy"></div>
    </div>

    <!-- === SETTINGS MODAL === -->
    <div id="settings-modal" class="modal-overlay" style="display: none">
      <div class="modal-content" style="max-width: 600px; height: auto">
        <h2 id="settings-title">Application Settings</h2>

        <div class="setting-item">
          <label for="ai-provider-select">AI Provider</label>
          <select id="ai-provider-select">
            <option value="gemini">Google Gemini</option>
            <option value="runpod">Custom Endpoint (RunPod/Ollama)</option>
          </select>
        </div>

        <div id="gemini-settings" class="provider-settings">
          <div class="setting-item">
            <label for="gemini-api-key">Google Gemini API Key</label>
            <input
              type="password"
              id="gemini-api-key"
              placeholder="Enter your key"
            />
          </div>
        </div>

        <div
          id="runpod-settings"
          class="provider-settings"
          style="display: none"
        >
          <div class="setting-item">
            <label for="runpod-url">Endpoint Base URL</label>
            <input
              type="text"
              id="runpod-url"
              placeholder="e.g., https://...-11434.proxy.runpod.net"
            />
            <small
              >Enter the main URL for your pod. The app will detect the API
              type.</small
            >
          </div>
          <div class="setting-item">
            <label for="ollama-model-select">Ollama Model</label>
            <div class="model-select-container">
              <select id="ollama-model-select">
                <option value="">-- Click Refresh to load models --</option>
              </select>
              <button id="refresh-models-button" title="Refresh model list">
                🔄
              </button>
            </div>
            <small
              >This must be a model available on your Ollama instance.</small
            >
          </div>
        </div>

        <div class="modal-actions">
          <button id="settings-save-button">Save Settings</button>
          <button id="settings-close-button">Close</button>
        </div>
      </div>
    </div>

    <!-- === IDEA WORKSPACE MODAL === -->
    <div id="idea-modal" class="modal-overlay" style="display: none">
      <div class="modal-content">
        <h2 id="modal-title">Node Details</h2>
        <div class="modal-main-area">
          <div class="modal-context-viewer">
            <h3>Original Idea Context</h3>
            <div id="modal-text-content"></div>
          </div>
          <div class="modal-chat-container">
            <h3>Discuss with AI</h3>
            <div id="chat-messages" class="chat-messages"></div>
            <form id="chat-form" class="chat-form">
              <input
                type="text"
                id="chat-input"
                placeholder="Ask a follow-up question..."
                autocomplete="off"
                required
              />
              <button type="submit">Send</button>
            </form>
          </div>
        </div>
        <div class="status-controls">
          <button class="status-btn" data-status="Idea">Idea</button>
          <button class="status-btn" data-status="InProgress">
            In Progress
          </button>
          <button class="status-btn" data-status="Completed">Completed</button>
          <button class="status-btn" data-status="Archived">Archived</button>
        </div>
        <div class="modal-actions">
          <button id="modal-delete-button" class="danger">Delete Node</button>
          <button id="modal-close-button">Close</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
